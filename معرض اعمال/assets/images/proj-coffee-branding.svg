<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="50%" stop-color="#3d1a75"/>
      <stop offset="100%" stop-color="#b5a1fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#d8b4fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow1)"/>
  <rect x="0" y="0" width="1200" height="220" fill="url(#glow2)"/>
  <!-- Sun/light streak -->
  <g opacity="0.45">
    <path d="M-100 200 Q400 100 900 250" stroke="#fff" stroke-width="40" fill="none" stroke-linecap="round"/>
    <path d="M300 150 Q700 120 1100 170" stroke="#fff" stroke-width="30" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Logo badge -->
  <g transform="translate(600, 330)">
    <rect x="-110" y="-90" width="220" height="180" rx="24" fill="#2a124a" stroke="#b5a1fc" stroke-width="4"/>
    <path d="M-90 60 Q-30 110 30 60 Q-30 110 -90 60" fill="none" stroke="#d8b4fe" stroke-width="6"/>
    <circle cx="0" cy="-20" r="38" fill="none" stroke="#d8b4fe" stroke-width="8"/>
    <text x="0" y="70" text-anchor="middle" font-family="Cairo,sans-serif" font-size="34" font-weight="700" fill="#fff" letter-spacing="4">CAFE</text>
    <text x="0" y="12" text-anchor="middle" font-family="Cairo,sans-serif" font-size="28" fill="#d8b4fe">غرفة عرض</text>
  </g>
  <!-- Steam swirls -->
  <path d="M550 420 Q580 380 620 420 Q650 380 700 420" stroke="#d8b4fe" stroke-width="10" fill="none" opacity="0.5">
    <animate attributeName="d" dur="3s" repeatCount="indefinite" values="M550 420 Q580 380 620 420 Q650 380 700 420;M560 450 Q590 410 630 450 Q660 410 710 450;M550 420 Q580 380 620 420 Q650 380 700 420"/>
  </path>
  <path d="M650 390 Q680 350 720 390 Q750 350 800 390" stroke="#c4b5fd" stroke-width="8" fill="none" opacity="0.4">
    <animate attributeName="d" dur="4s" repeatCount="indefinite" values="M650 390 Q680 350 720 390 Q750 350 800 390;M640 420 Q670 380 710 420 Q740 380 780 420;M650 390 Q680 350 720 390 Q750 350 800 390"/>
  </path>
  <!-- cups -->
  <ellipse cx="250" cy="650" rx="90" ry="20" fill="#4a1c2e" opacity="0.9"/>
  <g transform="translate(250, 600)">
    <path d="M-60 0 Q-60 -60 0 -60 Q60 -60 60 0 Z" fill="#faf0e6" stroke="#3d2c22" stroke-width="3"/>
    <circle cx="0" cy="-30" r="22" fill="none" stroke="#3d2c22" stroke-width="4"/>
    <rect x="-40" y="-30" width="80" height="40" fill="none" stroke="#3d2c22" stroke-width="4"/>
  </g>
  <g transform="translate(350, 610)">
    <ellipse cx="0" cy="-8" rx="50" ry="8" fill="#2a124a"/>
    <path d="M-50 0 Q-30 30 0 0 Q30 30 50 0 Z" fill="none" stroke="#7c3aed" stroke-width="5"/>
  </g>
  <!-- bottom light glow -->
  <ellipse cx="600" cy="770" rx="300" ry="40" fill="#d8b4fe" opacity="0.12"/>
</svg>

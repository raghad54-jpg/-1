<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0316"/>
      <stop offset="50%" stop-color="#2a124a"/>
      <stop offset="100%" stop-color="#b5a1fc"/>
    </linearGradient>
    <radialGradient id="lg3" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#d8b4fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg3)"/>
  <ellipse cx="600" cy="-60" rx="480" ry="180" fill="url(#lg3)"/>
  <!-- laptop -->
  <g transform="translate(600, 260)">
    <rect x="-150" y="-95" width="300" height="190" rx="12" fill="#1a0a33" stroke="#7c3aed" stroke-width="4"/>
    <rect x="-140" y="-85" width="280" height="170" rx="6" fill="#0f0418"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Cairo,sans-serif" font-size="14" fill="#d8b4fe" letter-spacing="3">Mockup UI</text>
    <g transform="translate(0, 30)">
      <rect x="-120" y="-50" width="240" height="100" rx="8" fill="#2a124a" opacity="0.7"/>
      <text x="0" y="-20" text-anchor="middle" font-family="Cairo,sans-serif" font-size="18" font-weight="700" fill="#fff">معرض أعمال</text>
      <text x="0" y="25" text-anchor="middle" font-family="Cairo,sans-serif" font-size="13" fill="#d8b4fe">4 قطع إبداعية</text>
    </g>
    <!-- cursor -->
    <path d="M-80 100 L-40 150 L-60 150 Z" fill="#b5a1fc" transform="rotate(-20)"/>
  </g>
  <!-- floating cards behind -->
  <g opacity="0.3">
    <rect x="60" y="400" width="260" height="160" rx="10" fill="#d8b4fe" transform="rotate(-8, 60, 480)"/>
    <rect x="920" y="350" width="260" height="160" rx="10" fill="#7c3aed" transform="rotate(8, 920, 430)"/>
    <rect x="420" y="520" width="240" height="160" rx="10" fill="#c4b5fd"/>
    <rect x="760" y="520" width="240" height="160" rx="10" fill="#a78bfa"/>
  </g>
  <!-- bottom badge -->
  <g transform="translate(600, 720)">
    <rect x="-90" y="-28" width="180" height="56" rx="28" fill="#2a124a" stroke="#b5a1fc" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" font-family="Cairo,sans-serif" font-size="18" font-weight="600" fill="#d8b4fe">تصميم موقع شخصي</text>
  </g>
  <ellipse cx="600" cy="760" rx="220" ry="20" fill="#b5a1fc" opacity="0.1"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050010"/>
      <stop offset="60%" stop-color="#1a0a33"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="lg2" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#b5a1fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg2)"/>
  <ellipse cx="600" cy="-50" rx="500" ry="200" fill="url(#lg2)"/>
  <!-- hanging bags -->
  <g transform="translate(450, 280)">
    <path d="M0 40 L0 200 Q-80 220 0 180 Q80 220 0 200 L0 40" fill="#f5f0e6" stroke="#a8907f" stroke-width="3"/>
    <path d="M0 200 L30 190 Q60 215 0 185 Z" fill="#8b5f3a" stroke="#5d3a2c" stroke-width="3"/>
    <ellipse cx="0" cy="40" rx="70" ry="14" fill="#2a124a" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <g transform="translate(650, 310)">
    <path d="M0 40 L0 200 Q-90 220 0 180 Q90 220 0 200 L0 40" fill="#e8e0d0" stroke="#a8907f" stroke-width="3"/>
    <path d="M0 200 L35 190 Q70 215 0 185 Z" fill="#4a3f3f" stroke="#1c1616" stroke-width="3"/>
  </g>
  <g transform="translate(800, 290)">
    <path d="M0 40 L0 200 Q-85 215 0 180 Q85 215 0 195 L0 40" fill="#fdf4e6" stroke="#b8a890" stroke-width="3"/>
    <path d="M0 195 L30 190 Q60 210 0 175 Z" fill="#a0947b" stroke="#4a3f32" stroke-width="3"/>
  </g>
  <g transform="translate(300, 400)">
    <path d="M0 40 L0 160 Q-65 175 0 145 Q65 175 0 155 L0 40" fill="#b5a1fc" stroke="#7c3aed" stroke-width="2"/>
    <ellipse cx="0" cy="40" rx="55" ry="12" fill="#2a124a"/>
  </g>
  <g transform="translate(900, 370)">
    <path d="M0 40 L0 170 Q-70 185 0 150 Q70 185 0 160 L0 40" fill="#c4b5fd" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <!-- mirror reflection -->
  <rect x="0" y="450" width="1200" height="120" fill="#2a124a" opacity="0.35"/>
  <!-- light streak -->
  <path d="M-100 300 Q300 200 800 350 Q1100 420 1300 380" stroke="#d8b4fe" stroke-width="8" fill="none" opacity="0.3"/>
  <!-- title text -->
  <text x="600" y="720" text-anchor="middle" font-family="Cairo,sans-serif" font-size="38" font-weight="800" fill="#fff" letter-spacing="2">استراتيجية الأكثر بيعاً</text>
  <text x="600" y="760" text-anchor="middle" font-family="Cairo,sans-serif" font-size="24" fill="#d8b4fe">مجموعة الحقائب المميزة</text>
</svg>
